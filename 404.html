<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | Nails Making Machine</title>
    <meta name="robots" content="noindex, follow">
    <script>
        (function() {
            // Retrieve path and query parameters
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Strip leading slashes to extract the target route slug
            var cleanSlug = path.replace(/^\/+/, '');

            // Redirect back to root passing the target route via parameter 'p'
            if (cleanSlug) {
                var redirectUrl = '/?p=' + encodeURIComponent(cleanSlug) + (search ? '&' + search.slice(1) : '') + hash;
                window.location.replace(redirectUrl);
            } else {
                window.location.replace('/');
            }
        })();
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loading-container {
            padding: 24px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #dcdfe3;
            border-top-color: #ba181b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Loading requested page...</p>
    </div>
</body>
</html>
