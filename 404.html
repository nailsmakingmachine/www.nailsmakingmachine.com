<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nails Making Machine</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#ba181b">
    <style>
        :root {
            --primary-dark: #1b1c1e;
            --primary-light: #ffffff;
            --accent-red: #ba181b;
            --accent-hover: #8f1013;
            --text-dark: #111111;
            --text-muted: #4a5568;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-stack);
            background-color: #f8f9fa;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .error-card {
            background: var(--primary-light);
            border: 1px solid #dcdfe3;
            border-radius: 8px;
            padding: 48px 32px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0,0,0,0.06);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: var(--accent-red);
            color: var(--primary-light);
            border: 2px solid var(--accent-red);
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
        }
        .btn-secondary:hover {
            background-color: var(--text-dark);
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Requested Resource Not Found</h1>
        <p>The machinery catalog item or specification path you are looking for has been updated, moved, or does not exist.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">Return to Homepage</a>
            <a href="/products-hub" class="btn btn-secondary">Browse Machines</a>
        </div>
    </div>
</body>
</html>
