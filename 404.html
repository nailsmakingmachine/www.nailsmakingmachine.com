<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | Nails Making Machine</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
    (function() {
      'use strict';
      var segmentCount = 0;
      var location = window.location;
      var path = location.pathname.slice(1);
      
      if (path) {
        var pathSegments = path.split('/');
        var cleanPath = pathSegments.slice(segmentCount).join('/');
        var search = location.search ? '&' + location.search.slice(1) : '';
        var redirectUrl = location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') + '/?p=' + encodeURIComponent(cleanPath) + search + location.hash;
        location.replace(redirectUrl);
      } else {
        location.replace('/');
      }
    })();
    </script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif; background:#0f1011; color:#ffffff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center;">
    <div>
        <h1 style="font-size:1.5rem; text-transform:uppercase; margin-bottom:8px; color:#ba181b;">Loading Industrial Specification</h1>
        <p style="color:#a0aec0; font-size:0.9rem;">Navigating to clean route...</p>
    </div>
</body>
</html>
