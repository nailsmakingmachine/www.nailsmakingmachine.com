# ==============================================================================
# NAILSMAKINGMACHINE.COM — PRODUCTION NGINX HIGH-PERFORMANCE SERVER CONFIGURATION
# Features: HTTP/2, TLS 1.3, Brotli/Gzip Compression, SPA Clean Routing, Full HSTS
# ==============================================================================

# HTTP Port 80 -> Permanent 301 Redirect to Canonical HTTPS WWW Domain
server {
    listen 80;
    listen [::]:80;
    server_name nailsmakingmachine.com www.nailsmakingmachine.com;

    location /.well-known/acme-challenge/ {
        root /var/www/nailsmakingmachine;
        allow all;
    }

    location / {
        return 301 https://www.nailsmakingmachine.com$request_uri;
    }
}

# HTTPS Apex Domain -> Permanent 301 Redirect to Canonical HTTPS WWW Domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nailsmakingmachine.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/nailsmakingmachine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nailsmakingmachine.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nailsmakingmachine.com/chain.pem;

    # High-Security TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    return 301 https://www.nailsmakingmachine.com$request_uri;
}

# Primary Canonical Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nailsmakingmachine.com;

    root /var/www/nailsmakingmachine;
    index index.html;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/nailsmakingmachine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nailsmakingmachine.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nailsmakingmachine.com/chain.pem;

    # Session & Handshake Optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Hardened Security Headers Suite
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com; connect-src 'self' https:;" always;

    # Gzip Compression Module
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/xhtml+xml image/svg+xml;

    # Brotli Compression (if ngx_brotli module compiled)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/xhtml+xml image/svg+xml;

    # Immutable Static Asset Caching (Core Web Vitals Boost)
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|pdf|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Stylesheets and Application Scripts
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # Crawler Directives & Manifest Caching
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # SPA Clean URL Rewriting Logic (No Hash Fragments Allowed)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Page Directives
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block Access to Hidden / Dot Files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
