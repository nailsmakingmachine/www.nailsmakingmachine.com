# ==============================================================================
# NAILS MAKING MACHINE - PRODUCTION NGINX SERVER CONFIGURATION
# Optimized for HTTP/2, TLS 1.3, Core Web Vitals, Security, and SPA Routing
# ==============================================================================

# HTTP -> HTTPS Redirect (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name nailsmakingmachine.com www.nailsmakingmachine.com;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/nailsmakingmachine;
        allow all;
    }

    location / {
        return 301 https://www.nailsmakingmachine.com$request_uri;
    }
}

# Non-WWW HTTPS -> WWW HTTPS Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nailsmakingmachine.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/nailsmakingmachine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nailsmakingmachine.com/privkey.pem;

    return 301 https://www.nailsmakingmachine.com$request_uri;
}

# Main HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nailsmakingmachine.com;

    root /var/www/nailsmakingmachine;
    index index.html;

    # SSL Configuration (A+ Rating)
    ssl_certificate /etc/letsencrypt/live/nailsmakingmachine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nailsmakingmachine.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.nailsmakingmachine.com https://*.google.com https://*.googleapis.com; frame-src https://www.youtube.com https://www.google.com https://maps.google.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip Compression Engine
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Single Page Application Clean Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets & Media Caching (1 Year Immutable)
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # CSS & JavaScript Caching (1 Month)
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # HTML Documents & Manifests (Revalidate Immediately)
    location ~* \.(html|webmanifest|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # RFC 9116 Security Contact Path
    location = /.well-known/security.txt {
        allow all;
        default_type text/plain;
    }

    # Block Access to Hidden & Sensitive Files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
